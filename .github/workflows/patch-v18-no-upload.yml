name: Patch V18 no-upload frontend

on:
  push:
    paths:
      - '.github/workflows/patch-v18-no-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V18 no-upload patch
        run: python patch_v18_no_upload.py
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Point V18 frontend to verified dataset endpoint"
          git push
# retrigger: verified dataset endpoint
